<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验证 - J/P/Z 纸片溢出检查</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #f5f5f5; }
    h2 { margin: 20px 0 10px; }
    .letter-grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .letter-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .letter-card canvas { display: block; border: 1px solid #ddd; }
    .letter-info { margin-top: 8px; font-size: 12px; line-height: 1.6; }
    .overflow { color: red; font-weight: bold; }
    .ok { color: green; font-weight: bold; }
    #fullPreview { max-width: 100%; border: 1px solid #ddd; }
    #log { white-space: pre-wrap; font-size: 12px; background: #222; color: #eee; padding: 10px; border-radius: 4px; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <h2>全图预览 (Seed: 72906, 逐字, 185%, 60%)</h2>
  <canvas id="fullCanvas"></canvas>

  <h2>问题字母检查 (J / P / Z)</h2>
  <div class="letter-grid" id="letterGrid"></div>

  <h2>验证日志</h2>
  <div id="log"></div>

  <script type="module">
    import { renderToCanvas } from './js/renderer.js';
    import { computeLayout, SIZES } from './js/layout.js';
    import { segmentText } from './js/segmenter.js';
    import { createRng, createPositionRng } from './js/rng.js';
    import { createColorScheme } from './js/palettes.js';
    import { analyzeGlyph, classifyShape, pickTearStyle, generatePaper, measureRealBounds } from './js/paper.js';
    import { getFontCss, getFontCount, waitForFonts } from './js/fonts.js';
    import { preloadAssets } from './js/assets.js';
    import { preloadBackgrounds } from './js/backgrounds.js';

    const log = document.getElementById('log');
    function logMsg(msg) {
      log.textContent += msg + '\n';
    }

    const PARAMS = {
      text: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      segmentMode: 'char',
      align: 'left',
      sizeKey: 'portrait',
      bgType: 'white',
      seed: 72906,
      randomAmount: 60,
      scale: 1.85,
      toggles: { color: true, font: true, size: true }
    };

    async function run() {
      logMsg('Loading fonts and assets...');
      // Wait for fonts with longer timeout to ensure accurate glyph measurement
      if (document.fonts) {
        await Promise.race([
          document.fonts.ready,
          new Promise(r => setTimeout(r, 5000))
        ]);
      }
      await waitForFonts();
      await preloadAssets();
      await preloadBackgrounds();
      await new Promise(r => setTimeout(r, 1500)); // extra render time
      logMsg('Fonts and assets loaded.');

      // 1. Render full collage
      const fullCanvas = document.getElementById('fullCanvas');
      renderToCanvas(PARAMS, fullCanvas);
      fullCanvas.id = 'fullPreview';
      logMsg('Full collage rendered.');

      // 2. Compute layout to get element data
      const size = SIZES[PARAMS.sizeKey];
      const isTransparent = PARAMS.bgType === 'transparent';
      const bleed = isTransparent ? Math.min(size.w, size.h) * 0.08 : size.w * 0.06;
      const globalRng = createRng(PARAMS.seed);
      const driftAmount = (PARAMS.randomAmount / 100) * 0.5;
      const colorScheme = createColorScheme(globalRng, driftAmount);

      const layoutCtx = fullCanvas.getContext('2d');
      const layout = computeLayout({
        units: segmentText(PARAMS.text, PARAMS.segmentMode),
        sizeKey: PARAMS.sizeKey, isTransparent, bleed,
        contentX: bleed, contentY: bleed,
        contentW: size.w - bleed * 2, contentH: size.h - bleed * 2,
        align: PARAMS.align, seed: PARAMS.seed,
        randomAmount: PARAMS.randomAmount, scale: PARAMS.scale,
        toggles: PARAMS.toggles, colorScheme, ctx: layoutCtx
      });

      // 3. Check each letter for overflow
      const targetLetters = ['J', 'P', 'Z'];
      const grid = document.getElementById('letterGrid');

      for (const el of layout.elements) {
        const letter = el.text;
        if (!targetLetters.includes(letter)) continue;

        const { paper, textW, textH, fontCss, glyphOx, glyphOy } = el;
        const bounds = paper.bounds;
        const isGlyphCutout = paper.type === 'glyphCutout';

        // Create verification canvas
        const padding = 30;
        const cw = Math.ceil(bounds.w + padding * 2);
        const ch = Math.ceil(bounds.h + padding * 2);
        const canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');

        ctx.save();
        ctx.translate(padding, padding);

        // Draw paper path (fill)
        ctx.fillStyle = '#f0e6d2';
        if (paper.mask) {
          // Draw mask
          const tmpMask = document.createElement('canvas');
          tmpMask.width = bounds.w;
          tmpMask.height = bounds.h;
          const tmCtx = tmpMask.getContext('2d');
          tmCtx.fillStyle = '#f0e6d2';
          tmCtx.fillRect(0, 0, bounds.w, bounds.h);
          tmCtx.globalCompositeOperation = 'destination-in';
          tmCtx.drawImage(paper.mask, 0, 0);
          ctx.drawImage(tmpMask, 0, 0);
        } else {
          ctx.fill(paper.path);
        }

        // Draw safeBox (red rectangle)
        const safeBox = {
          x: bounds.w / 2 - textW / 2 - 2,
          y: bounds.h / 2 - textH / 2 - 2,
          w: textW + 4,
          h: textH + 4
        };
        ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 2]);
        ctx.strokeRect(safeBox.x, safeBox.y, safeBox.w, safeBox.h);
        ctx.setLineDash([]);

        // Draw text bounds (blue rectangle)
        ctx.strokeStyle = 'rgba(0, 0, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.strokeRect(
          bounds.w / 2 - textW / 2,
          bounds.h / 2 - textH / 2,
          textW, textH
        );

        // Draw text
        ctx.font = fontCss;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#333';
        const textX = bounds.w / 2 - (isGlyphCutout ? 0 : (glyphOx || 0));
        const textY = bounds.h / 2 - (isGlyphCutout ? 0 : (glyphOy || 0));
        ctx.fillText(letter, textX, textY);

        // Overflow check: render paper and text separately, check pixels
        const checkCanvas = document.createElement('canvas');
        checkCanvas.width = Math.ceil(bounds.w);
        checkCanvas.height = Math.ceil(bounds.h);
        const cCtx = checkCanvas.getContext('2d');

        // Layer 1: paper (white fill)
        cCtx.fillStyle = '#fff';
        if (paper.mask) {
          const tmpM = document.createElement('canvas');
          tmpM.width = bounds.w;
          tmpM.height = bounds.h;
          const tmC = tmpM.getContext('2d');
          tmC.fillStyle = '#fff';
          tmC.fillRect(0, 0, bounds.w, bounds.h);
          tmC.globalCompositeOperation = 'destination-in';
          tmC.drawImage(paper.mask, 0, 0);
          cCtx.drawImage(tmpM, 0, 0);
        } else {
          cCtx.fill(paper.path);
        }

        // Get paper alpha mask
        const paperData = cCtx.getImageData(0, 0, checkCanvas.width, checkCanvas.height).data;
        const paperMask = new Uint8Array(checkCanvas.width * checkCanvas.height);
        for (let i = 0; i < paperMask.length; i++) {
          paperMask[i] = paperData[i * 4 + 3] > 10 ? 1 : 0;
        }

        // Layer 2: text only
        cCtx.clearRect(0, 0, checkCanvas.width, checkCanvas.height);
        cCtx.font = fontCss;
        cCtx.textAlign = 'center';
        cCtx.textBaseline = 'middle';
        cCtx.fillStyle = '#000';
        cCtx.fillText(letter, textX, textY);

        const textData = cCtx.getImageData(0, 0, checkCanvas.width, checkCanvas.height).data;
        let overflowPx = 0;
        let totalTextPx = 0;
        for (let i = 0; i < paperMask.length; i++) {
          if (textData[i * 4 + 3] > 10) {
            totalTextPx++;
            if (!paperMask[i]) overflowPx++;
          }
        }

        const overflowPct = totalTextPx > 0 ? (overflowPx / totalTextPx * 100) : 0;
        const hasOverflow = overflowPx > 0;

        ctx.restore();

        // Create card
        const card = document.createElement('div');
        card.className = 'letter-card';
        canvas.style.width = Math.min(cw, 400) + 'px';
        canvas.style.height = 'auto';
        card.appendChild(canvas);

        const info = document.createElement('div');
        info.className = 'letter-info';
        info.innerHTML = `
          <strong>字母: ${letter}</strong><br>
          形状: ${paper.type}<br>
          撕裂: ${paper.tear}<br>
          纸片尺寸: ${bounds.w.toFixed(1)} × ${bounds.h.toFixed(1)}<br>
          文字尺寸: ${textW.toFixed(1)} × ${textH.toFixed(1)}<br>
          文字溢出像素: ${overflowPx} / ${totalTextPx} (${overflowPct.toFixed(2)}%)<br>
          <span class="${hasOverflow ? 'overflow' : 'ok'}">${hasOverflow ? '⚠ 溢出!' : '✓ 无溢出'}</span><br>
          <span style="color:#999">红框=safeBox, 蓝框=文字边界</span>
        `;
        card.appendChild(info);
        grid.appendChild(card);

        logMsg(`Letter ${letter}: shape=${paper.type}, tear=${paper.tear}, overflow=${overflowPx}px/${totalTextPx}px (${overflowPct.toFixed(2)}%) ${hasOverflow ? 'OVERFLOW!' : 'OK'}`);
      }

      // 4. Check ALL letters for overflow (summary)
      logMsg('\n=== 全字母溢出检查 ===');
      const allResults = [];
      let totalOverflow = 0;
      for (const el of layout.elements) {
        const letter = el.text;
        const { paper, textW, textH, fontCss, glyphOx, glyphOy } = el;
        const bounds = paper.bounds;
        const isGlyphCutout = paper.type === 'glyphCutout';

        const checkCanvas2 = document.createElement('canvas');
        checkCanvas2.width = Math.ceil(bounds.w);
        checkCanvas2.height = Math.ceil(bounds.h);
        const c2 = checkCanvas2.getContext('2d');

        c2.fillStyle = '#fff';
        if (paper.mask) {
          const tmpM = document.createElement('canvas');
          tmpM.width = bounds.w;
          tmpM.height = bounds.h;
          const tmC = tmpM.getContext('2d');
          tmC.fillStyle = '#fff';
          tmC.fillRect(0, 0, bounds.w, bounds.h);
          tmC.globalCompositeOperation = 'destination-in';
          tmC.drawImage(paper.mask, 0, 0);
          c2.drawImage(tmpM, 0, 0);
        } else {
          c2.fill(paper.path);
        }

        const pData = c2.getImageData(0, 0, checkCanvas2.width, checkCanvas2.height).data;
        const pMask = new Uint8Array(checkCanvas2.width * checkCanvas2.height);
        for (let i = 0; i < pMask.length; i++) {
          pMask[i] = pData[i * 4 + 3] > 10 ? 1 : 0;
        }

        c2.clearRect(0, 0, checkCanvas2.width, checkCanvas2.height);
        c2.font = fontCss;
        c2.textAlign = 'center';
        c2.textBaseline = 'middle';
        c2.fillStyle = '#000';
        const tx = bounds.w / 2 - (isGlyphCutout ? 0 : (glyphOx || 0));
        const ty = bounds.h / 2 - (isGlyphCutout ? 0 : (glyphOy || 0));
        c2.fillText(letter, tx, ty);

        const tData = c2.getImageData(0, 0, checkCanvas2.width, checkCanvas2.height).data;
        let ov = 0, tt = 0;
        for (let i = 0; i < pMask.length; i++) {
          if (tData[i * 4 + 3] > 10) {
            tt++;
            if (!pMask[i]) ov++;
          }
        }
        const pct = tt > 0 ? (ov / tt * 100) : 0;
        const flag = ov > 0 ? ' ⚠' : '';
        totalOverflow += ov;
        allResults.push({ letter, shape: paper.type, tear: paper.tear, boundsW: bounds.w.toFixed(0), boundsH: bounds.h.toFixed(0), textW: textW.toFixed(0), textH: textH.toFixed(0), overflow: ov, total: tt, pct: pct.toFixed(2) });
        logMsg(`  ${letter}: shape=${paper.type}, tear=${paper.tear}, bounds=${bounds.w.toFixed(0)}×${bounds.h.toFixed(0)}, text=${textW.toFixed(0)}×${textH.toFixed(0)}, overflow=${ov}/${tt} (${pct.toFixed(2)}%)${flag}`);
      }

      // Show summary banner
      window.__verifyResults = allResults;
      const overflowLetters = allResults.filter(r => r.overflow > 0).map(r => r.letter);
      const summaryDiv = document.createElement('div');
      summaryDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;padding:15px 20px;font-size:24px;font-weight:bold;text-align:center;color:white;' + (totalOverflow === 0 ? 'background:#4CAF50;' : 'background:#f44336;');
      summaryDiv.textContent = totalOverflow === 0
        ? `✅ PASS: All 26 letters have 0 overflow`
        : `❌ FAIL: ${overflowLetters.length} letters overflow: ${overflowLetters.join(', ')}`;
      document.body.appendChild(summaryDiv);

      logMsg('\n=== 验证完成 ===');
    }

    run().catch(e => {
      logMsg('ERROR: ' + e.message + '\n' + e.stack);
      console.error(e);
    });
  </script>
</body>
</html>
